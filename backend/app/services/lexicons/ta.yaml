# Tamil. No word boundaries (same reason as hi.yaml).
boundary: false

signals:
  URGENCY:
    - 'உடனே'
    - 'உடனடியாக'
    - 'அவசரம்'
    - 'அவசர'
    - 'இன்றிரவு'
    - 'இன்று இரவு'
    - 'இன்றே'
    - '\d+\s*மணி நேரத்தில்'

  ACCOUNT_THREAT:
    - 'முடக்கப்படும்'
    - 'நிறுத்தப்படும்'
    - 'துண்டிக்கப்படும்'
    - 'தடை செய்யப்படும்'
    - 'மூடப்படும்'
    - 'சட்ட நடவடிக்கை'

  KYC_UPDATE:
    - 'கேஒய்சி'
    - 'KYC'
    - '(?:பான்|ஆதார்) (?:இணை|புதுப்பி)'

  REMOTE_ACCESS_APP:
    - 'AnyDesk'
    - 'எனிடெஸ்க்'
    - 'TeamViewer'
    - 'திரை பகிர்வு'

  PRIZE_LURE:
    - ['பரிசு', 0.5]
    - ['லாட்டரி', 0.55]
    - ['வென்றுள்ளீர்கள்', 0.5]
    - ['வாழ்த்துக்கள்', 0.3]
    - ['அதிர்ஷ்ட குலுக்கல்', 0.5]

  PAY_TO_EARN:
    - ['வீட்டிலிருந்தே', 0.45]
    - ['சம்பாதி', 0.4]
    - ['பதிவு கட்டணம்', 0.6]
    - ['செயலாக்க கட்டணம்', 0.6]
    - ['வீடியோ லைக்', 0.45]

  IMPERSONATION:
    - ['என் புதிய எண்', 0.55]
    - ['புதிய எண்', 0.4]
    - ['வங்கி அதிகாரி', 0.5]
    - ['மின்சார வாரிய அதிகாரி', 0.45]
    - ['மின் வாரிய அதிகாரி', 0.45]

