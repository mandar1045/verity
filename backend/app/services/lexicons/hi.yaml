# Hindi (Devanagari). No word boundaries: Python's \b splits Devanagari
# words at vowel signs, so patterns are matched as plain substrings.
boundary: false

signals:
  URGENCY:
    - 'तुरंत'
    - 'तुरन्त'
    - 'अभी'
    - 'जल्दी'
    - 'आज ही'
    - 'आज रात'
    - '\d+\s*घंटे'
    - 'फौरन'

  ACCOUNT_THREAT:
    - 'बंद (?:हो|कर दिया) जाएगा'
    - 'बंद (?:हो|कर दी) जाएगी'
    - 'ब्लॉक (?:हो|कर दिया) जाएगा'
    - 'निलंबित'
    - 'काट दी जाएगी'
    - 'कट जाएगी'
    - 'कानूनी कार्रवाई'

  KYC_UPDATE:
    - 'केवाईसी'
    - 'KYC'
    - '(?:पैन|आधार) (?:लिंक|अपडेट)'

  REMOTE_ACCESS_APP:
    - 'एनीडेस्क'
    - 'AnyDesk'
    - 'टीमव्यूअर'
    - 'स्क्रीन शेयर'

  PRIZE_LURE:
    - ['इनाम', 0.5]
    - ['लॉटरी', 0.55]
    - ['जीत(?:ा|े|ी) है', 0.5]
    - ['बधाई', 0.3]
    - ['लकी ड्रॉ', 0.5]

  PAY_TO_EARN:
    - ['घर बैठे', 0.45]
    - ['कमाएं', 0.4]
    - ['कमाइए', 0.4]
    - ['पंजीकरण शुल्क', 0.6]
    - ['रजिस्ट्रेशन (?:फीस|शुल्क)', 0.6]
    - ['प्रोसेसिंग (?:फीस|शुल्क)', 0.6]
    - ['वीडियो लाइक', 0.45]

  IMPERSONATION:
    - ['मेरा नया नंबर', 0.55]
    - ['नया नंबर', 0.4]
    - ['बैंक (?:अधिकारी|से बोल)', 0.5]
    - ['बिजली (?:विभाग|अधिकारी)', 0.45]

signals_extra:
  PIN_TERMS:
    - 'पिन'
    - 'स्कैन'
    - 'क्यूआर'
    - 'कलेक्ट रिक्वेस्ट'
  RECEIVE_TERMS:
    - 'प्राप्त'
    - 'पाने के लिए'
    - 'मिलेगा'
    - 'मिलेंगे'
    - 'क्रेडिट'
    - 'रिफंड'
  NEGATION_TERMS:
    - 'कभी नहीं'
    - 'कभी भी'
    - 'ज़रूरत नहीं'
    - 'जरूरत नहीं'
  CRED_ACTION:
    - 'बताएं'
    - 'बताइए'
    - 'बताओ'
    - 'भेजें'
    - 'भेजिए'
    - 'शेयर करें'
  CRED_OBJECT:
    - 'ओटीपी'
    - 'OTP'
    - 'पिन'
    - 'पासवर्ड'
  OTP_WARNING:
    - 'साझा न करें'
    - 'शेयर न करें'
    - 'किसी को न बताएं'
    - 'किसी के साथ साझा न'
    - 'कभी नहीं मांगता'
  CALL_WORDS:
    - 'कॉल करें'
    - 'संपर्क करें'
