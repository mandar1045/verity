headline:
  SAFE: "इस संदेश में धोखाधड़ी के कोई बड़े संकेत नहीं मिले।"
  SUSPICIOUS: "इस संदेश में कुछ खतरे के संकेत हैं। कुछ भी करने से पहले ध्यान से जाँचें।"
  HIGH_RISK: "यह संदेश लगभग निश्चित रूप से धोखा है। इस पर कोई कदम न उठाएँ।"

txn_headline:
  SAFE: "यह भुगतान इस खाते के लिए सामान्य लगता है।"
  SUSPICIOUS: "यह भुगतान असामान्य है। आगे बढ़ने से पहले प्राप्तकर्ता की जाँच करें।"
  HIGH_RISK: "यह भुगतान जाने-पहचाने धोखाधड़ी के तरीकों से मेल खाता है। रुकें और भुगतान से पहले जाँचें।"

signal:
  URGENCY:
    title: "जल्दी करने का दबाव"
    description: "इन शब्दों से जल्दबाज़ी कराता है: {evidence}।"
    sentence: "यह आपको जल्दबाज़ी में डालता है, ताकि आप सोचे बिना कदम उठाएँ।"
  ACCOUNT_THREAT:
    title: "खाता बंद करने की धमकी"
    description: "धमकी देता है: {evidence}।"
    sentence: "यह आपका खाता बंद करने की धमकी देता है। असली बैंक या कॉलेज संदेश से धमकी नहीं देते।"
  CREDENTIAL_REQUEST:
    title: "OTP, PIN या पासवर्ड माँगता है"
    description: "गुप्त जानकारी माँगता है: {evidence}।"
    sentence: "यह आपका OTP, PIN या पासवर्ड माँगता है। कोई असली बैंक या कॉलेज यह कभी नहीं माँगता।"
  PIN_TO_RECEIVE:
    title: "पैसे पाने के लिए PIN माँगा"
    description: "पैसे पाने के लिए PIN या स्कैन माँगता है: {evidence}।"
    sentence: "यह पैसे पाने के लिए आपका UPI PIN डालने को कहता है। पैसे पाने के लिए PIN की कभी ज़रूरत नहीं होती; PIN से हमेशा आपके खाते से पैसे जाते हैं।"
  SUSPICIOUS_LINK:
    title: "खतरनाक लिंक"
    description: "इस लिंक में खतरे के संकेत हैं: {evidence}।"
    sentence: "इसमें एक खतरनाक लिंक है। इसे न खोलें।"
  LOOKALIKE_DOMAIN:
    title: "नकली हमशक्ल वेबसाइट"
    description: "{evidence} किसी असली साइट के नाम की नकल है।"
    sentence: "यह लिंक किसी असली वेबसाइट के नाम की नकल करता है, पर यह दूसरी साइट है।"
  URL_SHORTENER:
    title: "छिपा हुआ छोटा लिंक"
    description: "छोटा लिंक असली पता छिपाता है: {evidence}।"
    sentence: "इसमें छोटा लिंक है जो छिपाता है कि वह असल में कहाँ ले जाता है।"
  REMOTE_ACCESS_APP:
    title: "स्क्रीन-शेयर ऐप का अनुरोध"
    description: "यह ऐप इंस्टॉल करने को कहता है: {evidence}।"
    sentence: "यह स्क्रीन-शेयर ऐप इंस्टॉल करने को कहता है। इससे कोई अजनबी आपके फ़ोन और बैंक ऐप को चला सकता है।"
  PRIZE_LURE:
    title: "इनाम का लालच"
    description: "इनाम का वादा: {evidence}।"
    sentence: "यह ऐसे इनाम का वादा करता है जिसकी आपने उम्मीद नहीं की थी।"
  PAY_TO_EARN:
    title: "पहले पैसे दो, फिर कमाओ"
    description: "कमाने के लिए पहले भुगतान माँगता है: {evidence}।"
    sentence: "यह कमाने या इनाम पाने के लिए पहले पैसे माँगता है। असली नौकरी या इनाम कभी फीस नहीं माँगते।"
  IMPERSONATION:
    title: "भरोसेमंद व्यक्ति होने का दिखावा"
    description: "दावा करता है: {evidence}।"
    sentence: "भेजने वाला किसी भरोसेमंद व्यक्ति, जैसे बैंक अधिकारी या परिवार के सदस्य, होने का दिखावा करता है।"
  KYC_UPDATE:
    title: "KYC अपडेट का अनुरोध"
    description: "KYC या पहचान अपडेट माँगता है: {evidence}।"
    sentence: "यह संदेश से KYC अपडेट करने को कहता है। बैंक KYC केवल शाखा में या अपने आधिकारिक ऐप में करते हैं।"
  SENDER_MISMATCH:
    title: "भेजने वाला मेल नहीं खाता"
    description: "{sender} से भेजा गया, जो {evidence} का आधिकारिक पता नहीं है।"
    sentence: "भेजने वाला उस संस्था का आधिकारिक पता नहीं है जिसका दावा संदेश करता है।"
  CALLBACK_NUMBER:
    title: "मोबाइल नंबर पर कॉल करने को कहता है"
    description: "इस नंबर पर कॉल करने को कहता है: {evidence}।"
    sentence: "यह एक निजी मोबाइल नंबर पर कॉल करने को कहता है। असली हेल्पलाइन नंबर आधिकारिक ऐप या कार्ड पर छपे होते हैं।"
  MODEL_TEXT:
    title: "धोखे जैसे शब्द"
    description: "ये शब्द हमारे मॉडल के अनुसार धोखे से जुड़े हैं: {evidence}।"
    sentence: "इसके शब्द उन धोखाधड़ी संदेशों से बहुत मिलते हैं जिनसे हमारे मॉडल ने सीखा है।"
  NEW_PAYEE_COLLECT:
    title: "नए व्यक्ति से कलेक्ट रिक्वेस्ट"
    sentence: "जिसे आपने कभी भुगतान नहीं किया, वह कलेक्ट रिक्वेस्ट मंज़ूर करने को कह रहा है। मंज़ूर करने पर आपके खाते से पैसे जाते हैं।"
  YOUNG_PAYEE_ACCOUNT:
    title: "बिलकुल नया प्राप्तकर्ता खाता"
    sentence: "प्राप्तकर्ता का खाता कुछ ही दिन पहले बना है।"
  PAYMENT_BURST:
    title: "लगातार कई भुगतान"
    sentence: "कुछ ही मिनटों में कई भुगतान जा रहे हैं।"
  NIGHT_HIGH_VALUE:
    title: "रात में बड़ा भुगतान"
    sentence: "यह देर रात का बड़ा भुगतान है, जो सामान्य राशि से बहुत ज़्यादा है।"
  DEVICE_CHANGE_HIGH_VALUE:
    title: "नया डिवाइस, बड़ी राशि"
    sentence: "खाता नए डिवाइस पर जाते ही एक बड़ा भुगतान हुआ।"
  REPORTED_PAYEE:
    title: "दूसरों ने इस प्राप्तकर्ता की शिकायत की है"
    sentence: "दूसरे उपयोगकर्ताओं ने इस प्राप्तकर्ता की धोखाधड़ी की शिकायत की है।"
  JUST_UNDER_LIMIT:
    title: "राशि सीमा से ठीक कम"
    sentence: "राशि किसी गोल सीमा से ठीक कम है और प्राप्तकर्ता नया है। धोखेबाज़ अतिरिक्त जाँच से बचने के लिए ऐसा करते हैं।"
  MULE_PATTERN:
    title: "मनी-म्यूल पैटर्न"
    sentence: "अजनबियों से कई छोटी रकम आईं और लगभग सारी एक साथ बाहर जा रही है। मनी-म्यूल खाते ऐसे ही काम करते हैं।"
  MODEL_TXN:
    title: "इस खाते के लिए असामान्य"
    sentence: "हमारा धोखाधड़ी मॉडल इस भुगतान को इस खाते के लिए असामान्य मानता है।"

