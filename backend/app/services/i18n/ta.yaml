headline:
  SAFE: "இந்தச் செய்தியில் மோசடியின் வலுவான அறிகுறிகள் எதுவும் இல்லை."
  SUSPICIOUS: "இந்தச் செய்தியில் எச்சரிக்கை அறிகுறிகள் உள்ளன. எதையும் செய்யும் முன் கவனமாகச் சரிபார்க்கவும்."
  HIGH_RISK: "இந்தச் செய்தி பெரும்பாலும் மோசடி. இதன்படி எதுவும் செய்ய வேண்டாம்."

txn_headline:
  SAFE: "இந்தக் கட்டணம் இந்தக் கணக்கிற்கு இயல்பானதாகத் தெரிகிறது."
  SUSPICIOUS: "இந்தக் கட்டணம் வழக்கத்திற்கு மாறானது. தொடரும் முன் பெறுநரைச் சரிபார்க்கவும்."
  HIGH_RISK: "இந்தக் கட்டணம் அறியப்பட்ட மோசடி முறைகளுடன் பொருந்துகிறது. செலுத்தும் முன் நிறுத்திச் சரிபார்க்கவும்."

signal:
  URGENCY:
    title: "அவசரப்படுத்தும் அழுத்தம்"
    description: "இந்தச் சொற்களால் அவசரப்படுத்துகிறது: {evidence}."
    sentence: "யோசிக்கும் முன் செயல்பட வைக்க இது உங்களை அவசரப்படுத்துகிறது."
  ACCOUNT_THREAT:
    title: "கணக்கை முடக்கும் மிரட்டல்"
    description: "மிரட்டுகிறது: {evidence}."
    sentence: "இது உங்கள் கணக்கை முடக்குவதாக மிரட்டுகிறது. உண்மையான வங்கிகள் செய்தி மூலம் மிரட்டுவதில்லை."
  CREDENTIAL_REQUEST:
    title: "OTP, PIN அல்லது கடவுச்சொல் கேட்கிறது"
    description: "ரகசிய விவரங்களைக் கேட்கிறது: {evidence}."
    sentence: "இது உங்கள் OTP, PIN அல்லது கடவுச்சொல்லைக் கேட்கிறது. எந்த உண்மையான வங்கியும் இவற்றைக் கேட்காது."
  PIN_TO_RECEIVE:
    title: "பணம் பெற PIN கேட்கிறது"
    description: "பணம் பெற PIN அல்லது ஸ்கேன் கேட்கிறது: {evidence}."
    sentence: "பணம் பெற உங்கள் UPI PIN-ஐ உள்ளிடச் சொல்கிறது. பணம் பெற PIN ஒருபோதும் தேவையில்லை; PIN எப்போதும் உங்கள் கணக்கிலிருந்து பணத்தை அனுப்ப மட்டுமே."
  SUSPICIOUS_LINK:
    title: "ஆபத்தான இணைப்பு"
    description: "இந்த இணைப்பில் ஆபத்து அறிகுறிகள் உள்ளன: {evidence}."
    sentence: "இதில் ஆபத்தான இணைப்பு உள்ளது. அதைத் திறக்க வேண்டாம்."
  LOOKALIKE_DOMAIN:
    title: "போலி ஒத்த இணையதளம்"
    description: "{evidence} ஒரு அதிகாரப்பூர்வ தளத்தின் பெயரைப் போலியாக்குகிறது."
    sentence: "இந்த இணைப்பு அதிகாரப்பூர்வ இணையதளத்தின் பெயரைப் பின்பற்றுகிறது, ஆனால் அது வேறு தளம்."
  URL_SHORTENER:
    title: "மறைக்கப்பட்ட சுருக்க இணைப்பு"
    description: "சுருக்க இணைப்பு உண்மையான முகவரியை மறைக்கிறது: {evidence}."
    sentence: "இது உண்மையில் எங்கே செல்கிறது என்பதை மறைக்கும் சுருக்க இணைப்பைப் பயன்படுத்துகிறது."
  REMOTE_ACCESS_APP:
    title: "திரை பகிர்வு செயலி கோரிக்கை"
    description: "இதை நிறுவச் சொல்கிறது: {evidence}."
    sentence: "இது திரை பகிர்வு செயலியை நிறுவச் சொல்கிறது. அதனால் அந்நியர் உங்கள் தொலைபேசியையும் வங்கி செயலிகளையும் இயக்க முடியும்."
  PRIZE_LURE:
    title: "பரிசு ஆசை காட்டுதல்"
    description: "பரிசு வாக்குறுதி: {evidence}."
    sentence: "நீங்கள் எதிர்பார்க்காத பரிசு அல்லது வெகுமதியை இது வாக்களிக்கிறது."
  PAY_TO_EARN:
    title: "முதலில் பணம் கட்டு, பிறகு சம்பாதி"
    description: "சம்பாதிக்க முதலில் கட்டணம் கேட்கிறது: {evidence}."
    sentence: "சம்பாதிக்க அல்லது பரிசு பெற முதலில் பணம் கேட்கிறது. உண்மையான வேலைகளும் பரிசுகளும் கட்டணம் கேட்பதில்லை."
  IMPERSONATION:
    title: "நம்பகமானவர் போல நடிப்பு"
    description: "இப்படிக் கூறுகிறது: {evidence}."
    sentence: "அனுப்புநர் வங்கி அதிகாரி அல்லது குடும்ப உறுப்பினர் போன்ற நம்பகமானவர் போல நடிக்கிறார்."
  KYC_UPDATE:
    title: "KYC புதுப்பிப்பு கோரிக்கை"
    description: "KYC அல்லது அடையாள புதுப்பிப்பு கேட்கிறது: {evidence}."
    sentence: "செய்தி மூலம் KYC புதுப்பிக்கச் சொல்கிறது. வங்கிகள் KYC-ஐ கிளையில் அல்லது அதிகாரப்பூர்வ செயலியில் மட்டுமே செய்யும்."
  SENDER_MISMATCH:
    title: "அனுப்புநர் பொருந்தவில்லை"
    description: "{sender} இலிருந்து அனுப்பப்பட்டது; இது {evidence} இன் அதிகாரப்பூர்வ முகவரி அல்ல."
    sentence: "செய்தி கூறும் நிறுவனத்தின் அதிகாரப்பூர்வ முகவரியிலிருந்து இது வரவில்லை."
  CALLBACK_NUMBER:
    title: "கைபேசி எண்ணை அழைக்கச் சொல்கிறது"
    description: "இந்த எண்ணை அழைக்கச் சொல்கிறது: {evidence}."
    sentence: "தனிப்பட்ட கைபேசி எண்ணை அழைக்கச் சொல்கிறது. உண்மையான உதவி எண்கள் அதிகாரப்பூர்வ செயலியில் அல்லது அட்டையில் இருக்கும்."
  MODEL_TEXT:
    title: "மோசடி போன்ற சொற்கள்"
    description: "எங்கள் மாதிரி மோசடியுடன் இணைக்கும் சொற்றொடர்கள்: {evidence}."
    sentence: "இதன் சொற்கள் எங்கள் மாதிரி கற்ற மோசடி செய்திகளுடன் மிகவும் ஒத்துப்போகின்றன."
  NEW_PAYEE_COLLECT:
    title: "புதிய பெறுநரிடமிருந்து கலெக்ட் கோரிக்கை"
    sentence: "நீங்கள் இதுவரை பணம் செலுத்தாத ஒருவர் கலெக்ட் கோரிக்கையை ஏற்கச் சொல்கிறார். ஏற்றால் உங்கள் கணக்கிலிருந்து பணம் போகும்."
  YOUNG_PAYEE_ACCOUNT:
    title: "புதிதாகத் தொடங்கிய பெறுநர் கணக்கு"
    sentence: "பெறுநரின் கணக்கு சில நாட்களுக்கு முன்புதான் தொடங்கப்பட்டது."
  PAYMENT_BURST:
    title: "தொடர்ச்சியான பல கட்டணங்கள்"
    sentence: "சில நிமிடங்களில் பல கட்டணங்கள் வெளியே செல்கின்றன."
  NIGHT_HIGH_VALUE:
    title: "இரவில் பெரிய கட்டணம்"
    sentence: "இது நள்ளிரவில் வழக்கத்தை விட மிக அதிகமான கட்டணம்."
  DEVICE_CHANGE_HIGH_VALUE:
    title: "புதிய சாதனம், பெரிய தொகை"
    sentence: "கணக்கு புதிய சாதனத்திற்கு மாறியவுடன் பெரிய கட்டணம் நடந்தது."
  REPORTED_PAYEE:
    title: "மற்றவர்கள் புகார் செய்த பெறுநர்"
    sentence: "மற்ற பயனர்கள் இந்தப் பெறுநர் மீது மோசடி புகார் செய்துள்ளனர்."
  JUST_UNDER_LIMIT:
    title: "வரம்புக்குச் சற்றுக் குறைவான தொகை"
    sentence: "தொகை ஒரு வரம்புக்குச் சற்றுக் குறைவாக, புதிய பெறுநருக்கு உள்ளது. கூடுதல் சோதனையைத் தவிர்க்க மோசடியாளர்கள் இப்படிச் செய்வார்கள்."
  MULE_PATTERN:
    title: "பணக் கழுதை (மியூல்) முறை"
    sentence: "அந்நியர்களிடமிருந்து பல சிறிய தொகைகள் வந்து, கிட்டத்தட்ட முழுவதும் ஒரே நேரத்தில் வெளியே செல்கிறது. மியூல் கணக்குகள் இப்படித்தான் செயல்படும்."
  MODEL_TXN:
    title: "இந்தக் கணக்கிற்கு வழக்கத்திற்கு மாறானது"
    sentence: "எங்கள் மோசடி மாதிரி இந்தக் கட்டணத்தை இந்தக் கணக்கிற்கு வழக்கத்திற்கு மாறானதாக மதிப்பிடுகிறது."

step:
  dont_click: "இந்தச் செய்தியில் உள்ள எந்த இணைப்பையும் திறக்க வேண்டாம்."
  dont_reply: "பதில் அனுப்ப வேண்டாம்; செய்தியில் உள்ள எந்த எண்ணையும் அழைக்க வேண்டாம்."
  no_otp_pin: "உங்கள் OTP, UPI PIN, CVV அல்லது கடவுச்சொல்லை யாருடனும் பகிர வேண்டாம்."
  decline_collect: "உங்கள் UPI செயலியில் கலெக்ட் கோரிக்கையை நிராகரிக்கவும்."
  pin_only_sends: "நினைவில் கொள்ளுங்கள்: UPI PIN உள்ளிட்டால் பணம் எப்போதும் வெளியே மட்டுமே போகும்."
  block_report: "உங்கள் UPI அல்லது செய்தி செயலியில் அனுப்புநரைத் தடுத்து புகார் செய்யவும்."
  call_1930: "பணம் இழந்திருந்தால், உடனே 1930 (தேசிய சைபர் குற்ற உதவி எண்) அழைக்கவும் அல்லது cybercrime.gov.in இல் புகார் செய்யவும்."
  contact_bank: "வங்கியை அதன் அதிகாரப்பூர்வ செயலி அல்லது அட்டையின் பின்புறம் உள்ள எண்ணில் மட்டுமே தொடர்பு கொள்ளவும்."
  uninstall_remote: "திரை பகிர்வு செயலியை நிறுவியிருந்தால், இப்போதே நீக்கி வங்கி கடவுச்சொற்களை மாற்றவும்."
  vit_helpdesk: "இந்தச் செய்தியை VIT IT உதவி மையத்திற்கு அனுப்பவும்."
  vit_password: "உங்கள் VTOP கடவுச்சொல்லை அதிகாரப்பூர்வ தளமான vtop.vit.ac.in இல் மட்டுமே மாற்றவும்."
  no_fee: "வேலை, பரிசு அல்லது கடன் பெற எந்தக் கட்டணமும் செலுத்த வேண்டாம்."
  verify_family: "பணம் அனுப்பும் முன், அவரின் பழைய, தெரிந்த எண்ணில் அழைத்துச் சரிபார்க்கவும்."
  verify_official: "இந்தச் செய்தி மூலம் அல்ல, அதிகாரப்பூர்வ செயலி அல்லது இணையதளத்தில் நீங்களே சரிபார்க்கவும்."
  bill_official: "உங்கள் மின் கட்டணத்தை மின் வாரியத்தின் அதிகாரப்பூர்வ செயலி அல்லது இணையதளத்தில் மட்டுமே பார்க்கவும்."
  return_via_bank: "தவறுதலாகப் பணம் அனுப்பியதாக யாராவது சொன்னால், அவர்களின் வங்கியைத் தொடர்பு கொள்ளச் சொல்லுங்கள். கலெக்ட் கோரிக்கை அல்லது QR மூலம் 'திருப்பி' அனுப்ப வேண்டாம்."
  safe_ok: "எதுவும் செய்யத் தேவையில்லை. PIN, OTP அல்லது பணம் கேட்கும் செய்திகளில் கவனமாக இருங்கள்."
  safe_trust: "இன்னும் சந்தேகம் இருந்தால், செயல்படும் முன் அதிகாரப்பூர்வ செயலியில் சரிபார்க்கவும்."
  txn_pause: "நிறுத்துங்கள். பெறுநரைச் சரிபார்க்கும் வரை இந்தக் கட்டணத்தை ஏற்க வேண்டாம்."
  txn_verify_payee: "பெறுநரின் பெயரையும் எண்ணையும் நம்பகமான ஒருவரிடம் உறுதிப்படுத்தவும்."
  txn_new_device: "நீங்கள் சாதனத்தை மாற்றவில்லை என்றால், இப்போதே வங்கியை அழைத்து UPI-ஐ முடக்கவும்."
  txn_mule: "உங்கள் கணக்கில் பணம் பெற்று வேறொருவருக்கு அனுப்ப யாரையும் அனுமதிக்க வேண்டாம். அது குற்றம் (மனி மியூலிங்)."
  txn_ok: "எதுவும் செய்யத் தேவையில்லை. இது இயல்பான கட்டணமாகத் தெரிகிறது."

